    <!-- Set <html data-theme> before CSS loads to avoid a white flash; follow the OS (live) until the button is clicked, then stick to localStorage.darkmode (same key as darkmode.js) -->
    
    <meta name="color-scheme" content="light dark">
    <script>
        (function () {
            var mq = window.matchMedia('(prefers-color-scheme: dark)');
            function stored() { try { return localStorage.getItem('darkmode'); } catch (e) { return null; } }
            function apply() {
                var s = stored();
                var dark = s === null ? mq.matches : s === 'true';
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            }
            apply();
            var onChange = function () { if (stored() === null) apply(); };
            if (mq.addEventListener) mq.addEventListener('change', onChange); else if (mq.addListener) mq.addListener(onChange);
            window.__toggleTheme = function () {
                var dark = document.documentElement.getAttribute('data-theme') !== 'dark';
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
                try { localStorage.setItem('darkmode', String(dark)); } catch (e) {}
            };
        })();
    </script>

<script>
    function getHashTarget(hash) {
        if (!hash) return null;
        const id = decodeURIComponent(hash.replace(/^#/, ""));
        if (!id) return null;
        let el = document.getElementById(id);
        if (!el && window.CSS && typeof CSS.escape === "function") {
            el = document.querySelector(`#${CSS.escape(id)}`);
        }
        return el;
    }

        function ensureFlashStyle() {
                if (document.getElementById("anchor-flash-style")) return;
                const style = document.createElement("style");
                style.id = "anchor-flash-style";
                style.textContent = `
@keyframes anchorFlashYellow {
    0%, 100% { background-color: transparent; }
    20%, 80% { background-color: rgba(255, 235, 59, 0.55); }
}
.anchor-flash-yellow {
    animation: anchorFlashYellow 1.1s ease-in-out 1;
}`;
                document.head.appendChild(style);
        }

    function getScrollOffset() {
                // Place target at the top edge of viewport.
                return 0;
    }

    function scrollToElementPrecisely(el, smooth = true) {
        if (!el) return;
        const top = window.pageYOffset + el.getBoundingClientRect().top - getScrollOffset();
        window.scrollTo({ top: Math.max(0, top), behavior: smooth ? 'smooth' : 'auto' });
    }

    function waitForImagesWithin(el) {
        if (!el) return Promise.resolve();
        const images = Array.from(el.querySelectorAll('img'));
        const pending = images.filter(img => !img.complete);
        if (pending.length === 0) return Promise.resolve();

        return Promise.all(
            pending.map(
                img =>
                    new Promise(resolve => {
                        img.addEventListener('load', resolve, { once: true });
                        img.addEventListener('error', resolve, { once: true });
                    }),
            ),
        );
    }

    function flashTarget(el) {
        if (!el) return;
        ensureFlashStyle();
        el.classList.remove("anchor-flash-yellow");
        void el.offsetWidth;
        el.classList.add("anchor-flash-yellow");
    }

    async function scrollToHashWhenReady(hash, { tries = 200, interval = 50 } = {}) {
        if (!hash) return false;
        for (let i = 0; i < tries; i++) {
            const el = getHashTarget(hash);
            if (el) {
                scrollToElementPrecisely(el, true);

                // Re-align after media/layout changes so final position is accurate.
                await waitForImagesWithin(el);
                await new Promise(r => setTimeout(r, 120));
                scrollToElementPrecisely(el, false);
                flashTarget(el);
                return true;
            }
            await new Promise(r => setTimeout(r, interval));
        }
        return false; // target never appeared
    }

    async function initPublicationsPage() {
        await refresh();    // insert your content
        await new Promise(r => requestAnimationFrame(r));
        await scrollToHashWhenReady(location.hash);
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initPublicationsPage);
    } else {
        initPublicationsPage();
    }

    window.addEventListener("hashchange", () => {
        scrollToHashWhenReady(location.hash);
    });
